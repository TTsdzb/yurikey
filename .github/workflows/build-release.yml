name: Build Release Module

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Check shell syntax
        run: find Module -name '*.sh' -exec sh -n {} \;

      - name: Read release version
        id: version
        run: |
          VERSION=$(sed -n 's/^version=//p' Module/module.prop)
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-action-only$ ]]; then
            echo "Invalid Action-only release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package module
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd Module
          zip -r "../Yurikey-${VERSION}.zip" .
          unzip -t "../Yurikey-${VERSION}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Yurikey ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: Yurikey-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          make_latest: true
